name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: new advisories appear for code that has not changed

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: synaptix, POSTGRES_PASSWORD: synaptix, POSTGRES_DB: synaptix }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U synaptix" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SYNAPTIX_DATABASE_URL: postgresql+asyncpg://synaptix:synaptix@localhost:5433/synaptix
      SYNAPTIX_REDIS_URL: redis://localhost:6380/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      # S3-compatible server that validates SigV4, for the object-storage tests. A step rather than
      # a service: service containers cannot pass it the `posix /data` arguments it needs.
      - run: >
          docker run -d --name s3 -p 9005:7070 --mount type=tmpfs,destination=/data
          versity/versitygw:v1.8.0 --access synaptix --secret synaptix-dev-secret posix /data
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run alembic upgrade head
      # A skipped test in CI means a backing service is missing, which must fail, not pass.
      - run: |
          uv run pytest -q -rs | tee pytest.log
          ! grep -q SKIPPED pytest.log

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t synaptix:ci .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Known vulnerabilities in the exact locked production dependency set.
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements.txt
      - run: uvx pip-audit -r requirements.txt --progress-spinner off

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Alert rules are code: validated, and unit-tested against synthetic series both ways.
      - run: >
          docker run --rm -v "$PWD/deploy/observability:/cfg:ro" --entrypoint promtool
          prom/prometheus:v3.15.0 check rules /cfg/alerts.yml
      - run: >
          docker run --rm -v "$PWD/deploy/observability:/cfg:ro" --entrypoint promtool
          prom/prometheus:v3.15.0 test rules /cfg/alerts_test.yml
      - run: python3 -m json.tool deploy/observability/grafana/dashboards/synaptix.json > /dev/null
