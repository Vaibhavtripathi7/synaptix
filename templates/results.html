<!DOCTYPE html>
<html>
<head>
    <title>Results</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f8f8f8; }
        .container { max-width: 900px; margin: 0 auto; background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; margin-bottom: 20px; }
        .section { margin-bottom: 20px; }
        .section-title { font-size: 1.2em; font-weight: bold; margin-bottom: 10px; }
        .summary, .insights { line-height: 1.6; }
        iframe { border: 1px solid #ccc; margin-top: 20px; width: 100%; height: 600px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Results</h1>

        <div class="section">
            <div class="section-title">Summary</div>
            <div class="summary">{{ summary }}</div>
        </div>

        <div class="section">
            <div class="section-title">Insights</div>
            <div class="insights">{{ insights }}</div>
        </div>

        <div class="section">  <div class="section-title">Download Report</div>
            <a href="{{ url_for('uploaded_file', filename=pdf_filename) }}">Download PDF Report</a>
        </div>


        <div class="section">
            <div class="section-title">Network Graph</div>
            <iframe src="/uploads/{{ graph_filename }}"></iframe>
        </div>

    </div>
</body>
</html>
