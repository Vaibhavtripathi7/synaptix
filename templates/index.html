<!DOCTYPE html>
<html>
<head>
    <title>PDF Summarizer</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f8f8f8; }
        .container { max-width: 800px; margin: 0 auto; background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); } /* Centered container */
        h1 { color: #333; text-align: center; margin-bottom: 20px; }
        form { display: flex; flex-direction: column; align-items: center;} /* Center form elements */
        input[type="file"] { margin-bottom: 10px; }
        input[type="submit"] { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; }

    </style>
</head>
<body>
    <div class="container">  <h1>PDF Summarizer</h1>
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="pdf_file"><br><br>
            <input type="submit" value="Upload">
        </form>
    </div>
</body>
</html>
