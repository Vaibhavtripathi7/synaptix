name: synaptix

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: synaptix
      POSTGRES_PASSWORD: synaptix
      POSTGRES_DB: synaptix
    ports: ["127.0.0.1:5433:5432"]   # non-default host port: never collides with a host Postgres
    volumes: [synaptix-pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synaptix"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Job queue. Never evicts: under memory pressure it refuses writes, which fails loudly, rather
  # than silently dropping queued jobs. No persistence, so user API keys in job payloads never
  # reach disk.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Answer cache. Separate from the queue precisely because it *should* evict: bounded memory,
  # least-recently-used answers go first.
  cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for development and tests (`--profile s3`): versitygw, which
  # validates SigV4 signatures as S3 does, so a signing bug fails here rather than in production.
  # (MinIO no longer publishes community images.) In production, point SYNAPTIX_S3_* at the real
  # service — S3, R2, GCS interop — instead.
  s3:
    image: versity/versitygw:v1.8.0
    profiles: [s3]
    command: ["--access", "synaptix", "--secret", "synaptix-dev-secret", "posix", "/data"]
    ports: ["127.0.0.1:9005:7070"]
    volumes: [synaptix-s3:/data]

  # Metrics and dashboards (`--profile observability`). Prometheus finds every API replica and
  # worker through Docker's DNS; Grafana starts with the Synaptix dashboard provisioned. Both
  # listen on localhost only: on a server, reach them through an SSH tunnel.
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB  # bounded: a metrics store must not fill the disk
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - synaptix-prometheus:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:13.2.2
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}  # dev default; set it anywhere real
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/synaptix.json
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - synaptix-grafana:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

  # Application containers only start with `--profile app`; plain `docker compose up`
  # runs just the infra so you can develop against it from the host .venv.

  # Migrations run once, here, before anything that needs the schema. Running them in each API
  # container's entrypoint would have every replica migrate concurrently on deploy.
  migrate:
    build: .
    profiles: [app]
    env_file: .env
    environment:
      SYNAPTIX_DATABASE_URL: postgresql+asyncpg://synaptix:synaptix@db:5432/synaptix
    depends_on:
      db: { condition: service_healthy }
    command: ["alembic", "upgrade", "head"]

  api:
    build: .
    profiles: [app]
    env_file: .env
    environment:
      SYNAPTIX_DATABASE_URL: postgresql+asyncpg://synaptix:synaptix@db:5432/synaptix
      SYNAPTIX_REDIS_URL: redis://redis:6379/0
      SYNAPTIX_CACHE_REDIS_URL: redis://cache:6379/0
      SYNAPTIX_LLM_WAIT_ON_RATE_LIMIT: "false"  # never sleep inside a request; fail over
    ports: ["127.0.0.1:8000:8000"]
    volumes: [synaptix-storage:/app/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      cache: { condition: service_healthy }

  worker:
    build: .
    profiles: [app]
    env_file: .env
    environment:
      SYNAPTIX_DATABASE_URL: postgresql+asyncpg://synaptix:synaptix@db:5432/synaptix
      SYNAPTIX_REDIS_URL: redis://redis:6379/0
    volumes: [synaptix-storage:/app/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    command: ["arq", "app.workers.settings.WorkerSettings"]

volumes:
  synaptix-pgdata:
  synaptix-storage:
  synaptix-s3:
  synaptix-prometheus:
  synaptix-grafana:
