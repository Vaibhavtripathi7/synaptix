# Production overlay for one VM. Only Caddy is reachable from outside; every other service lives
# on the private compose network. Run from the repository root:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --build
#
# Sized for a 2-vCPU / 4 GiB VM (Azure Standard_B2als_v2) from measured use: an API replica idles
# at ~180 MiB, the worker peaks at ~1.2 GiB parsing two PDFs at once (its `max_jobs`), Postgres
# gets 512 MB of buffers. That leaves room for the OS and the optional observability profile.
# On a bigger machine raise `api` replicas and the Postgres settings; Caddy finds new replicas
# by itself. Secrets come from `.env`; see deploy/env.production.example.

x-restart: &restart
  restart: unless-stopped
  logging:  # bounded logs: an unrotated json-file log eventually fills the disk
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

# Least privilege for everything that runs our code or faces the internet: nothing on the image
# is writable (uploads go to the storage volume, scratch to an in-memory /tmp), no Linux
# capabilities, no privilege escalation through setuid binaries, and a process cap against fork
# bombs. A compromised process can do little beyond what the application itself could.
x-hardened: &hardened
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 512

x-app-env: &app-env
  SYNAPTIX_ENV: prod
  SYNAPTIX_DATABASE_URL: postgresql+asyncpg://synaptix:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/synaptix
  # 2 app containers x (10 + 5) = 30 connections, well inside Postgres's 100.
  SYNAPTIX_DB_POOL_SIZE: "10"
  SYNAPTIX_DB_MAX_OVERFLOW: "5"

services:
  db:
    <<: *restart
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB  # a planner hint: what the OS page cache can hold
      - -c
      - maintenance_work_mem=128MB  # index builds and vacuum
      - -c
      - work_mem=8MB

  redis:
    <<: *restart
    ports: !reset []

  cache:
    <<: *restart
    ports: !reset []
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  migrate:
    <<: *hardened
    environment: *app-env

  api:
    <<: [*restart, *hardened]
    ports: !reset []
    mem_limit: 768m  # idles at ~180 MiB; an upload of up to 100 MB is held in memory while checked
    environment:
      <<: *app-env
      SYNAPTIX_CACHE_REDIS_URL: redis://cache:6379/0
      SYNAPTIX_LLM_WAIT_ON_RATE_LIMIT: "false"
      # Behind Caddy every request arrives from Caddy's address: without this, all users would
      # share one per-IP rate-limit bucket. Caddy writes the client address into
      # X-Forwarded-For and does not trust one sent by the client, so one hop is exactly right.
      SYNAPTIX_TRUSTED_PROXY_HOPS: "1"
    deploy:
      replicas: 1  # one per spare core: the worker's parser needs the other

  worker:
    <<: [*restart, *hardened]
    # Measured peak 1.2 GiB with two PDFs parsing at once. A PDF that pushes past this is the
    # parser child's problem: the kernel kills the largest process, and the job fails cleanly.
    mem_limit: 1536m
    environment: *app-env

  caddy:
    <<: [*restart, *hardened]
    cap_add: [NET_BIND_SERVICE]  # the one capability it needs: ports 80 and 443
    image: caddy:2-alpine
    profiles: [app]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data  # certificates: losing this means re-issuing and Let's Encrypt limits
      - caddy-config:/config
    depends_on: [api]

  # Observability, when started with `--profile observability`: same restart and log policy as
  # the rest, and no default Grafana password on a real machine.
  prometheus:
    <<: *restart

  grafana:
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}

volumes:
  caddy-data:
  caddy-config:
