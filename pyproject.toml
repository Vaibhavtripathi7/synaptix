[project]
name = "synaptix"
version = "0.1.0"
description = "Study and research workbench over PDFs: structured ingestion with vision OCR, hybrid retrieval with reranking, cited answers, study guides and paper comparisons."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "arq>=0.26",
    "pymupdf>=1.24.9",
    "pymupdf4llm>=0.0.17",
    "google-genai>=1.0",
    "structlog>=24.1",
    "tiktoken>=0.7",
    "prometheus-client>=0.26.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
extend-exclude = ["legacy"]  # keep ruff's defaults (.git, .venv, ...); add the prototype
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# one loop for the whole run: the async engine's pool is bound to the loop it was created on
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
