# Scrapes every API replica and every worker on the compose network. Replicas are discovered
# through Docker's DNS — one A record per container — so scaling `api` or `worker` needs no
# change here. The metrics ports are never published outside that network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9100
        refresh_interval: 15s

  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9101
        refresh_interval: 15s
